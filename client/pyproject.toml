[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "qwen3-tts-client"
dynamic = ["version"]
description = "Lightweight Python client SDK for Qwen3-TTS standalone engine and Triton endpoints."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Qwen3TTS-Streaming Contributors"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "requests>=2.31.0",
]

[project.optional-dependencies]
grpc = [
  "grpcio>=1.67.1",
  "protobuf>=5.29.6,<7",
]
triton = [
  "tritonclient[grpc,http]>=2.54.0",
]
audio = [
  "numpy>=1.26.0",
]
all = [
  "grpcio>=1.67.1",
  "protobuf>=5.29.6,<7",
  "tritonclient[grpc,http]>=2.54.0",
  "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/X-Square-Robot/Qwen3TTS-Streaming"
Documentation = "https://github.com/X-Square-Robot/Qwen3TTS-Streaming/blob/main/docs/user/client_sdk.md"

# Version comes from git tags at the repo root (this package lives in a
# subdirectory of the engine monorepo — engine image tag and wheel version
# are derived from the same tag, which is what keeps them paired).
[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build.hooks.vcs]
version-file = "src/qwen3tts/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen3tts", "src/qwen3tts_protocol"]
