[build-system]
# GitHub and GitLab both support tag releases. Pin the complete versioning
# toolchain so each pipeline's one-and-only wheel build is repeatable.
requires = [
  "hatchling==1.31.0",
  "hatch-vcs==0.5.0",
  "setuptools-scm==10.2.0",
]
build-backend = "hatchling.build"

[project]
name = "qwen3-tts-client"
dynamic = ["version"]
description = "Native WebSocket client SDK for Qwen3-TTS with OpenAI Realtime compatibility."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Qwen3TTS-Streaming Contributors"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "requests>=2.31.0",
  "websocket-client>=1.9.0",
]

[project.optional-dependencies]
grpc = [
  "grpcio>=1.67.1",
  "protobuf>=5.29.6,<7",
]
triton = [
  "tritonclient[grpc,http]>=2.54.0",
]
audio = [
  "numpy>=1.26.0",
]
all = [
  "grpcio>=1.67.1",
  "protobuf>=5.29.6,<7",
  "tritonclient[grpc,http]>=2.54.0",
  "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/X-Square-Robot/Qwen3TTS-Streaming"
Documentation = "https://github.com/X-Square-Robot/Qwen3TTS-Streaming/blob/main/docs/user/client_sdk.md"

# Version comes from git tags at the repo root (this package lives in a
# subdirectory of the engine monorepo — engine image tag and wheel version
# are derived from the same tag, which is what keeps them paired).
[tool.hatch.version]
source = "vcs"

# Repo rule: only v<digit> tags are version tags (they live on dev/beta/main;
# personal branches never tag versions). Both the describe --match and the
# tag_regex filter guarantee markers like rime/xxx or legacy odd tags can
# never pollute wheel version derivation.
[tool.hatch.version.raw-options]
root = ".."
tag_regex = "^v(?P<version>[0-9].*)$"
git_describe_command = [
  "git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*",
]

[tool.hatch.build.hooks.vcs]
version-file = "src/qwen3tts/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen3tts", "src/qwen3tts_protocol"]
