syntax = "proto3";

package tts;

service TTSService {
  // Query the currently loaded standalone engine capabilities.
  rpc GetCapabilities (GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  // Convenience unary wrapper for FULL_TEXT mode. The server still
  // normalizes/tokenizes internally before backend execution.
  rpc SynthesizeOnce (SynthesizeOnceRequest) returns (stream SynthesizeResponse);
  // Primary transport protocol: start -> text* -> end/cancel.
  // TextChunk carries raw transport text; backend inference remains token-native.
  rpc SynthesizeStream (stream SynthesizeRequest) returns (stream SynthesizeResponse);
}

enum InputMode {
  INPUT_MODE_UNSPECIFIED = 0;
  INPUT_MODE_TOKEN = 1;
  INPUT_MODE_CLAUSE = 2;
  INPUT_MODE_LONG_SEGMENT = 3;
  INPUT_MODE_FULL_TEXT = 4;
}

enum GroupPolicy {
  GROUP_POLICY_UNSPECIFIED = 0;
  GROUP_POLICY_NONE = 1;
  GROUP_POLICY_AUTO = 2;
}

enum AudioEncoding {
  AUDIO_ENCODING_UNSPECIFIED = 0;
  AUDIO_ENCODING_PCM_F32 = 1;
  AUDIO_ENCODING_PCM_S16LE = 2;
}

message AudioFormat {
  AudioEncoding encoding = 1;
  int32 sample_rate = 2;
  int32 channels = 3;
}

message SamplingParams {
  float temperature = 1;
  int32 top_k = 2;
  float top_p = 3;
  float repetition_penalty = 4;
  int32 max_new_tokens = 5;
  bool do_sample = 6;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  string variant = 1;
  string loaded_model_type = 2;
  repeated string declared_supported_task_types = 3;
  repeated InputMode supported_input_modes = 4;
  repeated GroupPolicy supported_group_policies = 5;
  repeated AudioFormat supported_audio_formats = 6;
  bool ref_audio_available = 7;
  string ref_audio_reason = 8;
  bool speaker_encoder_available = 9;
  bool ref_codec_available = 10;
  bool icl_available = 11;
  float ref_audio_max_duration_sec = 12;
  bool ref_c2w_warm_state_available = 13;
  string ref_codec_reason = 14;
  string protocol_version = 15;
  repeated string supported_output_policy_features = 16;
  repeated string supported_vad_strategies = 17;
  repeated string supported_timing_fields = 18;
}

message SessionConfig {
  string task_type = 1;
  string language = 2;
  string speaker = 3;
  string instruct = 4;
  bytes ref_audio = 5;
  string ref_text = 6;
  bool x_vector_only = 7;
  InputMode input_mode = 8;
  GroupPolicy group_policy = 9;
  AudioFormat audio = 10;
  SamplingParams sampling = 11;
  OutputPolicy output_policy = 12;
  TimingContext timing = 13;
  string protocol_version = 14;
}

message VADPolicy {
  bool enabled = 1;
  string strategy = 2;          // disabled | prefix_trim | tail_guard | hybrid
  string implementation = 3;   // e.g. energy | tenvad; advisory only in v1
  map<string, string> config = 4;
}

message OutputPolicy {
  VADPolicy vad_policy = 1;
  int32 chunk_ms = 2;
  string packet_format = 3;    // raw_pcm for current transports
  optional bool emit_text_events = 4;
  map<string, string> config = 5;
}

message TimingContext {
  string request_id = 1;
  string turn_id = 2;
  int64 client_request_ts_ms = 3;
  int64 client_text_ts_ms = 4;
  int64 client_end_ts_ms = 5;
  map<string, string> extra = 6;
}

message SynthesizeOnceRequest {
  string session_id = 1;
  string speaker = 2;        // legacy compatibility
  string task_type = 3;      // legacy compatibility
  string language = 4;       // legacy compatibility
  bytes ref_audio = 5;       // legacy compatibility
  string ref_text = 6;       // legacy compatibility
  string text = 7;
  SessionConfig config = 8;  // preferred
}

message SynthesizeRequest {
  oneof request {
    StartRequest start = 1;
    TextChunk text = 2;
    EndRequest end = 3;
    CancelRequest cancel = 4;

    // Legacy compatibility path.
    InitRequest init = 10;
    TextComplete done = 11;
  }
}

message StartRequest {
  string session_id = 1;
  SessionConfig config = 2;
}

message InitRequest {
  string session_id = 1;
  string speaker = 2;
  string task_type = 3;
  string language = 4;
  bytes ref_audio = 5;
  string ref_text = 6;
  string instruct = 7;
  bool x_vector_only = 8;
  InputMode input_mode = 9;
  GroupPolicy group_policy = 10;
  AudioFormat audio = 11;
}

message TextChunk {
  string text = 1;  // transport text chunk; canonical tokenization happens server-side
  int64 seq_no = 2;
  int64 client_timestamp_ms = 3;
}

message EndRequest {
  int64 client_timestamp_ms = 1;
}

message TextComplete {}  // legacy alias for end-of-input

message CancelRequest {
  string reason = 1;
}

message SynthesizeResponse {
  oneof response {
    AudioChunk audio = 1;
    StreamEvent event = 2;
    StatusUpdate status = 3;  // deprecated compatibility path
  }
}

message AudioChunk {
  bytes pcm_data = 1;
  int32 sample_rate = 2;
  AudioEncoding encoding = 3;
  int32 channels = 4;
  map<string, string> meta = 5;
}

message StreamEvent {
  string type = 1;          // start | text_token | text_boundary_commit | segment_end | warning | done | error
  string session_id = 2;
  int32 segment_id = 3;     // -1 when not segment-scoped
  string text = 4;
  string message = 5;
  AudioFormat audio = 6;    // populated on start
  map<string, string> meta = 7;
}

message StatusUpdate {
  string event = 1;
  string message = 2;
  map<string, string> metrics = 3;
}
