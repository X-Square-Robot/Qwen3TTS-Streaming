#      release-notes/rel-26-04.html
#
#  To update from the official website:
#    bash scripts/bash/autorun.sh update-matrix
#
#  Format (tab/space separated, newest-first):
#    ngc_tag  min_driver  tensorrt_version  cuda_version  python_version  size_gb
#
#  - ngc_tag:         NGC container tag (e.g. 25.11)
#  - min_driver:      Minimum NVIDIA driver version (major.minor)
#  - tensorrt_version: TensorRT runtime / Python package version reported by
#                      the generic Triton container release notes
#  - cuda_version:    CUDA toolkit version in the container
#  - python_version:  Python version in the container (e.g. 3.12)
#  - size_gb:         Approximate NGC image size in GB
#                     (use "-" if unknown)
#
#  Lines starting with # are comments.  Blank lines are ignored.
#  Sorted newest-first: first compatible match wins.
