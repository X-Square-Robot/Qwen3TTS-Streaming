name: qwen3-tts

services:
  engine:
    profiles: ["engine"]
    image: ${ENGINE_IMAGE:-qwen3-engine:26.02}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.engine
      args:
        BASE_IMAGE: ${ENGINE_BASE_IMAGE:-nvcr.io/nvidia/tensorrt:26.02-py3}
        PYTORCH_CUDA_TAG: ${ENGINE_PYTORCH_CUDA_TAG:-cu130}
    container_name: ${ENGINE_CONTAINER_NAME:-qwen3-engine}
    working_dir: /app
    command: ["/bin/bash", "/app/scripts/compose/engine-entrypoint.sh"]
    environment:
      ENGINE_CONFIG: ${ENGINE_CONFIG:-/etc/qwen3-tts/engine.yaml}
      ENGINE_MODEL_REPOSITORY: /models
      ENGINE_MODEL_NAME: ${ENGINE_MODEL_NAME:-tts_orchestrator}
      ENGINE_MODEL_VERSION: ${ENGINE_MODEL_VERSION:-1}
      ENGINE_MODEL_PACKAGE_DIR: ${ENGINE_MODEL_PACKAGE_DIR:-/models/tts_orchestrator/1}
      ENGINE_DEVICE: ${ENGINE_DEVICE:-0}
      ENGINE_GRPC_PORT: ${ENGINE_GRPC_PORT:-50051}
      ENGINE_WEBSOCKET_PORT: ${ENGINE_WEBSOCKET_PORT:-50052}
      ENGINE_HEALTH_PORT: ${ENGINE_HEALTH_PORT:-8080}
      ENGINE_MAX_BATCH_SIZE: ${ENGINE_MAX_BATCH_SIZE:-128}
      ENGINE_MAX_SESSIONS: ${ENGINE_MAX_SESSIONS:-128}
      ENGINE_MAX_SEQ_LEN: ${ENGINE_MAX_SEQ_LEN:-}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${ENGINE_GRPC_PORT:-50051}:${ENGINE_GRPC_PORT:-50051}"
      - "${ENGINE_WEBSOCKET_PORT:-50052}:${ENGINE_WEBSOCKET_PORT:-50052}"
      - "${ENGINE_HEALTH_PORT:-8080}:${ENGINE_HEALTH_PORT:-8080}"
    volumes:
      - ${MODEL_REPO_DIR:-../../workspace/model_repository}:/models:ro
      - ${ENGINE_CONFIG_FILE:-../../engine.yaml}:/etc/qwen3-tts/engine.yaml:ro
    gpus: all
    init: true
    shm_size: "4g"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os, urllib.request; urllib.request.urlopen(\"http://127.0.0.1:%s/health\" % os.environ.get(\"ENGINE_HEALTH_PORT\", \"8080\"), timeout=2).read()'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ../../engine
          target: /app/engine
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: sync+restart
          path: ../../engine.yaml
          target: /app/engine.yaml
        - action: sync+restart
          path: ../../scripts/compose
          target: /app/scripts/compose
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ../Dockerfile.engine
        - action: rebuild
          path: ../.dockerignore

  triton:
    profiles: ["triton"]
    image: ${TRITON_IMAGE:-qwen3-tts-triton:26.02}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.triton
      args:
        BASE_IMAGE: ${TRITON_BASE_IMAGE:-nvcr.io/nvidia/tritonserver:26.02-py3}
        TENSORRT_PYTHON_VERSION: ${TRITON_TENSORRT_PYTHON_VERSION:-10.15.1.29}
        PYTORCH_CUDA_TAG: ${TRITON_PYTORCH_CUDA_TAG:-cu130}
    container_name: ${TRITON_CONTAINER_NAME:-qwen3-tts-triton}
    environment:
      MAX_BATCH_SLOTS: ${TRITON_MAX_BATCH_SLOTS:-128}
      ENGINE_MAX_DECODE_LEN: ${TRITON_MAX_SEQ_LEN:-512}
      MAX_SESSIONS: ${TRITON_MAX_SESSIONS:-128}
      CUDA_VISIBLE_DEVICES: ${TRITON_GPU_DEVICE:-0}
      PYTORCH_CUDA_ALLOC_CONF: ${TRITON_PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - tritonserver
      - --model-repository=/models
      - --strict-model-config=false
      - --log-verbose=1
    ports:
      - "${TRITON_HTTP_PORT:-8000}:8000"
      - "${TRITON_GRPC_PORT:-8001}:8001"
      - "${TRITON_METRICS_PORT:-8002}:8002"
    volumes:
      - ${MODEL_REPO_DIR:-../../workspace/model_repository}:/models:ro
    gpus: all
    shm_size: "4g"
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ../../engine
          target: /opt/qwen3-tts/engine
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: restart
          path: ../../workspace/model_repository
        - action: rebuild
          path: ../Dockerfile.triton
        - action: rebuild
          path: ../.dockerignore

  demo-api:
    profiles: ["demo"]
    image: ${DEMO_API_IMAGE:-qwen3-tts-demo-api:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.demo-api
    container_name: ${DEMO_API_CONTAINER_NAME:-qwen3-tts-demo-api}
    working_dir: /app
    environment:
      QWEN_DEMO_TRITON_GRPC: ${QWEN_DEMO_TRITON_GRPC:-triton:8001}
      QWEN_DEMO_TRITON_MODEL: ${QWEN_DEMO_TRITON_MODEL:-tts_orchestrator}
      QWEN_DEMO_PORT: 7860
      QWEN_DEMO_ENABLE_LIVE_CONCURRENCY: ${QWEN_DEMO_ENABLE_LIVE_CONCURRENCY:-0}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${DEMO_API_PORT:-7860}:7860"
    volumes:
      - ${DEMO_TRACES_DIR:-../../workspace/demo_traces}:/app/workspace/demo_traces
    restart: unless-stopped

  webui:
    profiles: ["demo"]
    image: node:20-bookworm-slim
    container_name: ${WEBUI_CONTAINER_NAME:-qwen3-tts-webui}
    working_dir: /app/webui
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_DEMO_API_URL: ${VITE_DEMO_API_URL:-http://localhost:${DEMO_API_PORT:-7860}}
    ports:
      - "${WEBUI_PORT:-5173}:5173"
    volumes:
      - ../..:/app
    depends_on:
      - demo-api
    restart: unless-stopped
