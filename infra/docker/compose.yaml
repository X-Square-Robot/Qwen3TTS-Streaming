name: qwen3-tts

services:
  engine:
    profiles: ["engine"]
    image: ${ENGINE_IMAGE:-qwen3-engine:26.02}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.engine
      args:
        BASE_IMAGE: ${ENGINE_BASE_IMAGE:-nvcr.io/nvidia/pytorch:26.02-py3}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.bfsu.edu.cn/pypi/web/simple}
        ENGINE_VERSION: ${ENGINE_VERSION:-}
        CLIENT_WHEEL_FILENAME: ${CLIENT_WHEEL_FILENAME:-}
        CLIENT_WHEEL_SHA256: ${CLIENT_WHEEL_SHA256:-}
        BROWSER_SDK_VERSION: ${BROWSER_SDK_VERSION:-}
        BROWSER_SDK_REGISTRY_URL: ${BROWSER_SDK_REGISTRY_URL:-}
        BROWSER_SDK_TARBALL_URL: ${BROWSER_SDK_TARBALL_URL:-}
    container_name: ${ENGINE_CONTAINER_NAME:-qwen3-engine}
    working_dir: /app
    command:
      - python3
      - /tmp/qwen3tts_rotating_log_runner.py
      - --service
      - engine
      - --
      - /bin/bash
      - /app/scripts/compose/engine-entrypoint.sh
    environment:
      ENGINE_CONFIG: ${ENGINE_CONFIG:-/etc/qwen3-tts/engine.yaml}
      ENGINE_MODEL_REPOSITORY: /models
      ENGINE_MODEL_NAME: ${ENGINE_MODEL_NAME:-tts_orchestrator}
      ENGINE_MODEL_VERSION: ${ENGINE_MODEL_VERSION:-1}
      ENGINE_MODEL_PACKAGE_DIR: ${ENGINE_MODEL_PACKAGE_DIR:-/models/tts_orchestrator/1}
      # Emergency override: load engine/ code from the model package instead of
      # the image (hotfix without an image rebuild). Default off = image code.
      ENGINE_CODE_FROM_PACKAGE: ${ENGINE_CODE_FROM_PACKAGE:-0}
      ENGINE_DEVICE: ${ENGINE_DEVICE:-0}
      ENGINE_GRPC_PORT: ${ENGINE_GRPC_PORT:-50051}
      ENGINE_WEBSOCKET_PORT: ${ENGINE_WEBSOCKET_PORT:-50052}
      ENGINE_HEALTH_PORT: ${ENGINE_HEALTH_PORT:-8080}
      ENGINE_HEALTH_PROBE_MODE: ${ENGINE_HEALTH_PROBE_MODE:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      TLS_AUTO_ENABLE: ${TLS_AUTO_ENABLE:-false}
      TLS_DIR: /app/tls
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      ENGINE_MAX_BATCH_SIZE: ${ENGINE_MAX_BATCH_SIZE:-128}
      ENGINE_MAX_SESSIONS: ${ENGINE_MAX_SESSIONS:-128}
      ENGINE_MAX_SEQ_LEN: ${ENGINE_MAX_SEQ_LEN:-}
      QWEN_LOG_DIR: ${QWEN_LOG_DIR:-/var/log/qwen3tts}
      QWEN_LOG_MAX_BYTES: ${QWEN_LOG_MAX_BYTES:-52428800}
      QWEN_LOG_BACKUP_COUNT: ${QWEN_LOG_BACKUP_COUNT:-10}
      QWEN_LOG_STDOUT: ${QWEN_LOG_STDOUT:-1}
      QWEN3_CURSOR_DUMP: ${QWEN3_CURSOR_DUMP:-0}
      QWEN3_CURSOR_DUMP_PATH: ${QWEN3_CURSOR_DUMP_PATH:-/tmp/qwen3-cursor-dump.jsonl}
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    ports:
      - "${ENGINE_GRPC_PORT:-50051}:${ENGINE_GRPC_PORT:-50051}"
      - "${ENGINE_WEBSOCKET_PORT:-50052}:${ENGINE_WEBSOCKET_PORT:-50052}"
      # The early health listener stays container-internal. Public health,
      # Demo, SDK and WebSocket traffic share ENGINE_WEBSOCKET_PORT.
    volumes:
      - ${MODEL_REPO_DIR:-../../workspace/model_repository}:/models:ro
      - ${ENGINE_CONFIG_FILE:-../../engine.yaml}:/etc/qwen3-tts/engine.yaml:ro
      - ${TLS_HOST_DIR:-../../workspace/tls}:/app/tls:ro
      - ../../scripts/compose/rotating_log_runner.py:/tmp/qwen3tts_rotating_log_runner.py:ro
    gpus: all
    init: true
    shm_size: "4g"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os, urllib.request; urllib.request.urlopen(\"http://127.0.0.1:%s/health\" % os.environ.get(\"ENGINE_HEALTH_PORT\", \"8080\"), timeout=2).read()'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ../../engine
          target: /app/engine
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: sync+restart
          path: ../../client/src/qwen3tts_protocol
          target: /app/qwen3tts_protocol
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: sync+restart
          path: ../../engine.yaml
          target: /app/engine.yaml
        - action: sync+restart
          path: ../../scripts/compose
          target: /app/scripts/compose
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ../Dockerfile.engine
        - action: rebuild
          path: ../.dockerignore

  triton:
    profiles: ["triton"]
    image: ${TRITON_IMAGE:-qwen3tts-streaming:26.02}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.triton
      args:
        BASE_IMAGE: ${TRITON_BASE_IMAGE:-nvcr.io/nvidia/tritonserver:26.02-py3}
        TENSORRT_PYTHON_VERSION: ${TRITON_TENSORRT_PYTHON_VERSION:-10.15.1.29}
        PYTORCH_CUDA_TAG: ${TRITON_PYTORCH_CUDA_TAG:-cu130}
        TRITON_RUNTIME_BASE_IMAGE: ${TRITON_RUNTIME_BASE_IMAGE:-triton-deps}
        ENGINE_VERSION: ${ENGINE_VERSION:-}
        CLIENT_WHEEL_FILENAME: ${CLIENT_WHEEL_FILENAME:-}
        CLIENT_WHEEL_SHA256: ${CLIENT_WHEEL_SHA256:-}
        BROWSER_SDK_VERSION: ${BROWSER_SDK_VERSION:-}
        BROWSER_SDK_REGISTRY_URL: ${BROWSER_SDK_REGISTRY_URL:-}
        BROWSER_SDK_TARBALL_URL: ${BROWSER_SDK_TARBALL_URL:-}
    container_name: ${TRITON_CONTAINER_NAME:-qwen3tts-streaming}
    environment:
      MAX_BATCH_SLOTS: ${TRITON_MAX_BATCH_SLOTS:-128}
      ENGINE_MAX_DECODE_LEN: ${TRITON_MAX_SEQ_LEN:-512}
      MAX_SESSIONS: ${TRITON_MAX_SESSIONS:-128}
      # Comma-separated speakers to prewarm the prefix KV cache at startup so the
      # first real request per speaker is warm (~20ms TTFT instead of ~50ms cold).
      ENGINE_PREWARM_SPEAKERS: ${ENGINE_PREWARM_SPEAKERS:-}
      CUDA_VISIBLE_DEVICES: ${TRITON_GPU_DEVICE:-0}
      PYTORCH_CUDA_ALLOC_CONF: ${TRITON_PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      PYTHONDONTWRITEBYTECODE: "1"
      QWEN_LOG_DIR: ${QWEN_LOG_DIR:-/var/log/qwen3tts}
      QWEN_LOG_MAX_BYTES: ${QWEN_LOG_MAX_BYTES:-52428800}
      QWEN_LOG_BACKUP_COUNT: ${QWEN_LOG_BACKUP_COUNT:-10}
      QWEN_LOG_STDOUT: ${QWEN_LOG_STDOUT:-1}
      TZ: Asia/Shanghai
    command:
      - python3
      - /tmp/qwen3tts_rotating_log_runner.py
      - --service
      - triton
      - --
      - tritonserver
      - --model-repository=/models
      - --strict-model-config=false
      # Verbose logging is off by default: on a decoupled streaming model it logs
      # 2 synchronous lines per audio-chunk response, adding real per-chunk latency.
      # Set TRITON_LOG_VERBOSE=1 to re-enable for debugging.
      - --log-verbose=${TRITON_LOG_VERBOSE:-0}
    ports:
      - "${TRITON_HTTP_PORT:-8000}:8000"
      - "${TRITON_GRPC_PORT:-8001}:8001"
      - "${TRITON_METRICS_PORT:-8002}:8002"
    volumes:
      - ${MODEL_REPO_DIR:-../../workspace/model_repository}:/models:ro
      - ../../scripts/compose/rotating_log_runner.py:/tmp/qwen3tts_rotating_log_runner.py:ro
    gpus: all
    init: true
    shm_size: "4g"
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ../../engine
          target: /opt/qwen3-tts/engine
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: restart
          path: ../../workspace/model_repository
        - action: restart
          path: ../../scripts/compose/rotating_log_runner.py
        - action: rebuild
          path: ../Dockerfile.triton
        - action: rebuild
          path: ../.dockerignore

  realtime-gateway:
    profiles: ["triton"]
    image: ${TRITON_IMAGE:-qwen3tts-streaming:26.02}
    container_name: ${TRITON_REALTIME_CONTAINER_NAME:-qwen3tts-realtime-gateway}
    working_dir: /opt/qwen3-tts
    command:
      - python3
      - /tmp/qwen3tts_rotating_log_runner.py
      - --service
      - realtime-gateway
      - --
      - python3
      - -m
      - engine.gateway.triton_realtime_server
    environment:
      TRITON_GRPC_ENDPOINT: triton:8001
      TRITON_MODEL_NAME: ${ENGINE_MODEL_NAME:-tts_orchestrator}
      TRITON_MODEL_VERSION: ${ENGINE_MODEL_VERSION:-1}
      TRITON_MODEL_PACKAGE_DIR: ${ENGINE_MODEL_PACKAGE_DIR:-/models/tts_orchestrator/1}
      TRITON_REALTIME_HOST: 0.0.0.0
      TRITON_REALTIME_PORT: 50052
      TRITON_REALTIME_USAGE_LOG: /var/lib/qwen3tts/realtime_usage.jsonl
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      TRITON_GRPC_AUTH_TOKEN: ${TRITON_GRPC_AUTH_TOKEN:-}
      QWEN_LOG_DIR: ${QWEN_LOG_DIR:-/var/log/qwen3tts}
      QWEN_LOG_MAX_BYTES: ${QWEN_LOG_MAX_BYTES:-52428800}
      QWEN_LOG_BACKUP_COUNT: ${QWEN_LOG_BACKUP_COUNT:-10}
      QWEN_LOG_STDOUT: ${QWEN_LOG_STDOUT:-1}
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    ports:
      - "${TRITON_REALTIME_HOST_PORT:-50053}:50052"
    volumes:
      - ${MODEL_REPO_DIR:-../../workspace/model_repository}:/models:ro
      - ${TRITON_REALTIME_USAGE_DIR:-../../workspace/realtime_usage}:/var/lib/qwen3tts
      - ../../scripts/compose/rotating_log_runner.py:/tmp/qwen3tts_rotating_log_runner.py:ro
    depends_on:
      - triton
    init: true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:50052/health\", timeout=2).read()'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ../../engine
          target: /opt/qwen3-tts/engine
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: sync+restart
          path: ../../client/src/qwen3tts_protocol
          target: /opt/qwen3-tts/qwen3tts_protocol
          ignore:
            - __pycache__/
            - "*.pyc"
