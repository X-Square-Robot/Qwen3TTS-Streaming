services:
  engine:
    volumes:
      - ../../engine:/app/engine:ro
      - ../../engine.yaml:/app/engine.yaml:ro
      - ../../scripts/compose:/app/scripts/compose:ro

  triton:
    volumes:
      - ../../engine:/opt/qwen3-tts/engine:ro

  realtime-gateway:
    volumes:
      - ../../engine:/opt/qwen3-tts/engine:ro
      - ../../client/src/qwen3tts_protocol:/opt/qwen3-tts/qwen3tts_protocol:ro
