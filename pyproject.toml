# Qwen3TTS-Streaming — dependency grouping and tool configuration.
# This file is NOT a installable Python package definition — engine/, demo_api/,
# and client/ are separate sub-projects with their own packaging.
# It exists solely to:
#   1. Declare optional dependency groups for `pip install -e ".[group]"`
#   2. Configure pytest markers and test paths
# The lifecycle is driven by scripts/bash/ (see README); there is no installable
# Python CLI here.

[project]
name = "qwen3tts-streaming"
version = "0.1.0"
description = "Qwen3TTS-Streaming inference system"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # client/src is imported via PYTHONPATH in tests/tools, bypassing the
    # qwen3-tts-client wheel metadata that would otherwise pull this in.
    "websocket-client>=1.9.0",
]
client = [
    "qwen3-tts-client[all]",
]
demo = [
    "aiohttp>=3.9",
    "numpy>=1.24",
    "qwen3-tts-client[all]",
]
export = [
    "torch>=2.1",
    "safetensors",
    "transformers",
    "onnxruntime>=1.17",
    "numpy>=1.24",
]
engine = [
    "torch>=2.1",
    "onnxruntime>=1.17",
    "numpy>=1.24",
    "grpcio>=1.67.1",
    "protobuf>=5.29.6,<7",
    "pyyaml>=6.0",
]
dev = [
    "qwen3tts-streaming[test,client,demo]",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# No installable Python package — the lifecycle lives in scripts/bash/.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: L1 unit tests — pure logic, no GPU or external services required",
    "integration: L2 integration tests — may require exported models, GPU, or Docker",
    "e2e: L3 end-to-end tests — requires a running TTS service (standalone or Triton)",
    "gpu: requires CUDA GPU",
    "docker: requires Docker daemon",
    "slow: tests that take more than a few seconds",
]

[tool.ruff]
# 不 lint 不属于本仓库的代码：third_party/ 是上游 Qwen3-TTS 子模块（不可修改），
# workspace/ 是运行时产物。其余 gitignore 内容 ruff 默认已跳过。
extend-exclude = ["third_party", "workspace"]

[tool.ruff.lint.per-file-ignores]
# 库代码（engine/ client/src/ demo_api/）保持严格；以下为辅助代码的合理放宽。
# tools/：手动验证 / benchmark / 冻结 repro 工具（非 pytest，见 CLAUDE.md），
#   容许脚本式紧凑写法与调试中间量。
"tools/**" = ["E402", "E701", "E702", "F841"]
# scripts/：导出与辅助脚本，sys.path 引导后再 import；设备/精度探测中间量。
"scripts/**" = ["E402", "F841"]
# tests/：fixture / 路径引导后 import；断言用的中间量。
"tests/**" = ["E402", "F841"]
"client/tests/**" = ["F841"]
# model_repository/：Triton BLS 模型，运行时注入 import 路径。
"model_repository/**" = ["E402"]
# 再导出枢纽：从共享协议层 qwen3tts_protocol 拉名字再暴露给 engine.interface 其余模块，
# 本文件内不直接使用属有意再导出（详见各文件注释）。
"engine/interface/protocol.py" = ["F401"]
"engine/interface/types.py" = ["F401"]
