# Qwen3-TTS Triton — dependency grouping and tool configuration.
# This file is NOT a installable Python package definition — engine/, demo_api/,
# and client/ are separate sub-projects with their own packaging.
# It exists solely to:
#   1. Declare optional dependency groups for `pip install -e ".[group]"`
#   2. Configure pytest markers and test paths
# The lifecycle is driven by scripts/bash/ (see README); there is no installable
# Python CLI here.

[project]
name = "qwen3-tts-triton"
version = "0.1.0"
description = "Qwen3-TTS Triton inference system"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
client = [
    "qwen3-tts-client[all]",
]
demo = [
    "aiohttp>=3.9",
    "numpy>=1.24",
    "qwen3-tts-client[all]",
]
export = [
    "torch>=2.1",
    "safetensors",
    "transformers",
    "onnxruntime>=1.17",
    "numpy>=1.24",
]
engine = [
    "torch>=2.1",
    "onnxruntime>=1.17",
    "numpy>=1.24",
    "grpcio>=1.67.1",
    "protobuf>=5.29.6,<7",
    "pyyaml>=6.0",
]
dev = [
    "qwen3-tts-triton[test,client,demo]",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# No installable Python package — the lifecycle lives in scripts/bash/.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: L1 unit tests — pure logic, no GPU or external services required",
    "integration: L2 integration tests — may require exported models, GPU, or Docker",
    "e2e: L3 end-to-end tests — requires a running TTS service (standalone or Triton)",
    "gpu: requires CUDA GPU",
    "docker: requires Docker daemon",
    "slow: tests that take more than a few seconds",
]
