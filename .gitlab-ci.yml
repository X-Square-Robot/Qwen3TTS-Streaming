workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$/'
    - when: never

stages:
  - sdk-build
  - sdk-publish
  - image
  - release

# hatch-vcs derives the SDK version from the release tag, so the main checkout
# needs complete tag metadata. The SDK is self-contained under client/ and
# must never fetch the upstream model repository. Project/group CI variables
# can override every mirror default below (prefer an internal Registry in
# production).
variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: "none"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_INDEX_URL: "https://mirrors.bfsu.edu.cn/pypi/web/simple"
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  ENGINE_BASE_IMAGE: "m.daocloud.io/nvcr.io/nvidia/pytorch:26.02-py3"
  RUNNER_PYTHON_IMAGE: "m.daocloud.io/docker.io/library/python:3.11-slim"
  RUNNER_DOCKER_CLI_IMAGE: "m.daocloud.io/docker.io/library/docker:27.4.1-cli"
  RUNNER_DOCKER_DIND_IMAGE: "m.daocloud.io/docker.io/library/docker:27.4.1-dind"
  RUNNER_GLAB_IMAGE: "m.daocloud.io/registry.gitlab.com/gitlab-org/cli:v1.58.0"
  DEBIAN_MIRROR: "https://mirrors.bfsu.edu.cn/debian"
  DEBIAN_SECURITY_MIRROR: "https://mirrors.bfsu.edu.cn/debian-security"
  ALPINE_MIRROR: "https://mirrors.bfsu.edu.cn/alpine"
  ENGINE_RELEASE_IMAGE: "$CI_REGISTRY_IMAGE/engine:$CI_COMMIT_TAG"
  ENGINE_BUILD_CACHE_IMAGE: "$CI_REGISTRY_IMAGE/engine:buildcache"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"
  DOCKER_BUILDKIT: "1"

.tag-release-job:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$/'
  interruptible: false

build-client-wheel:
  extends: .tag-release-job
  stage: sdk-build
  image: "$RUNNER_PYTHON_IMAGE"
  variables:
    GIT_STRATEGY: clone
  before_script:
    - |
      for sources_file in /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources; do
        [ ! -f "$sources_file" ] || sed -i \
          -e "s|http://deb.debian.org/debian-security|${DEBIAN_SECURITY_MIRROR}|g" \
          -e "s|https://deb.debian.org/debian-security|${DEBIAN_SECURITY_MIRROR}|g" \
          -e "s|http://security.debian.org/debian-security|${DEBIAN_SECURITY_MIRROR}|g" \
          -e "s|https://security.debian.org/debian-security|${DEBIAN_SECURITY_MIRROR}|g" \
          -e "s|http://deb.debian.org/debian|${DEBIAN_MIRROR}|g" \
          -e "s|https://deb.debian.org/debian|${DEBIAN_MIRROR}|g" \
          "$sources_file"
      done
    - apt-get update
    - apt-get install --yes --no-install-recommends git
  script:
    - |
      initialized_submodules="$(git submodule status | sed -n '/^[^-]/p')"
      if [ -n "$initialized_submodules" ]; then
        echo "Release checkout unexpectedly contains initialized submodules:" >&2
        echo "$initialized_submodules" >&2
        exit 1
      fi
    - bash scripts/bash/release_client_wheel.sh --out build/client-dist
    - |
      wheel_count="$(find build/client-dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' | wc -l)"
      if [ "$wheel_count" -ne 1 ]; then
        echo "Expected exactly one client wheel, found $wheel_count" >&2
        exit 1
      fi
      wheel="$(find build/client-dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' -print)"
      wheel_filename="$(basename "$wheel")"
      sdk_version="${CI_COMMIT_TAG#v}"
      wheel_sha256="$(sha256sum "$wheel" | cut -d' ' -f1)"
      printf 'SDK_VERSION=%s\nWHEEL_FILENAME=%s\nWHEEL_SHA256=%s\n' \
        "$sdk_version" "$wheel_filename" "$wheel_sha256" \
        > build/client-wheel.env
    - |
      wheel="$(realpath "$(find build/client-dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' -print)")"
      python -m venv /tmp/qwen3tts-wheel-smoke
      /tmp/qwen3tts-wheel-smoke/bin/pip install \
        "qwen3-tts-client[all] @ file://$wheel" pytest pytest-asyncio
      EXPECTED_VERSION="${CI_COMMIT_TAG#v}" env -u PYTHONPATH \
        /tmp/qwen3tts-wheel-smoke/bin/python -c \
        'import os, qwen3tts, qwen3tts_protocol; assert qwen3tts.__version__ == os.environ["EXPECTED_VERSION"]'
      env -u PYTHONPATH /tmp/qwen3tts-wheel-smoke/bin/python \
        -m pytest client/tests -q
  artifacts:
    expire_in: 7 days
    paths:
      - build/client-dist/*.whl
      - build/client-wheel.env
    reports:
      dotenv: build/client-wheel.env
  cache:
    key: pip-release
    paths:
      - .cache/pip/

publish-client-wheel:
  extends: .tag-release-job
  stage: sdk-publish
  image: "$RUNNER_PYTHON_IMAGE"
  needs:
    - job: build-client-wheel
      artifacts: true
  variables:
    GIT_STRATEGY: none
  before_script:
    - |
      for sources_file in /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources; do
        [ ! -f "$sources_file" ] || sed -i \
          -e "s|http://deb.debian.org/debian-security|${DEBIAN_SECURITY_MIRROR}|g" \
          -e "s|https://deb.debian.org/debian-security|${DEBIAN_SECURITY_MIRROR}|g" \
          -e "s|http://security.debian.org/debian-security|${DEBIAN_SECURITY_MIRROR}|g" \
          -e "s|https://security.debian.org/debian-security|${DEBIAN_SECURITY_MIRROR}|g" \
          -e "s|http://deb.debian.org/debian|${DEBIAN_MIRROR}|g" \
          -e "s|https://deb.debian.org/debian|${DEBIAN_MIRROR}|g" \
          "$sources_file"
      done
    - apt-get update
    - apt-get install --yes --no-install-recommends curl
    - python -m pip install twine==6.2.0
  resource_group: "client-package-$CI_COMMIT_TAG"
  script:
    - python -m twine check "build/client-dist/$WHEEL_FILENAME"
    - |
      wheel="build/client-dist/$WHEEL_FILENAME"
      registry_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/files/${WHEEL_SHA256}/${WHEEL_FILENAME}"
      registry_status="$(curl --silent --show-error --location \
        --retry 5 --retry-all-errors \
        --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
        --output /tmp/published-client.whl \
        --write-out '%{http_code}' \
        "$registry_url")"
      case "$registry_status" in
        200)
          published_sha256="$(sha256sum /tmp/published-client.whl | cut -d' ' -f1)"
          if [ "$published_sha256" != "$WHEEL_SHA256" ]; then
            echo "Registry already contains different bytes for $WHEEL_FILENAME" >&2
            exit 1
          fi
          echo "Client wheel is already present in the GitLab PyPI registry."
          ;;
        404)
          TWINE_USERNAME="gitlab-ci-token" TWINE_PASSWORD="$CI_JOB_TOKEN" \
            python -m twine upload \
              --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" \
              "$wheel"
          ;;
        *)
          echo "Unexpected GitLab Package Registry response: HTTP $registry_status" >&2
          exit 1
          ;;
      esac
      curl --fail --silent --show-error --location \
        --retry 5 --retry-all-errors \
        --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
        --output /tmp/published-client.whl \
        "$registry_url"
      published_sha256="$(sha256sum /tmp/published-client.whl | cut -d' ' -f1)"
      if [ "$published_sha256" != "$WHEEL_SHA256" ]; then
        echo "Published wheel checksum does not match the built artifact" >&2
        exit 1
      fi
      release_url="${CI_PROJECT_URL}/-/releases/${CI_COMMIT_TAG}/downloads/client-sdk/${WHEEL_FILENAME}"
      pypi_index_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/simple"
      printf 'SDK_VERSION=%s\nWHEEL_FILENAME=%s\nWHEEL_SHA256=%s\nWHEEL_REGISTRY_URL=%s\nWHEEL_RELEASE_URL=%s\nGITLAB_PYPI_INDEX_URL=%s\n' \
        "$SDK_VERSION" "$WHEEL_FILENAME" "$WHEEL_SHA256" \
        "$registry_url" "$release_url" "$pypi_index_url" \
        > build/published-client-wheel.env
  artifacts:
    expire_in: 7 days
    paths:
      - build/published-client-wheel.env
    reports:
      dotenv: build/published-client-wheel.env

build-engine-image:
  extends: .tag-release-job
  stage: image
  timeout: 3h
  resource_group: engine-image-cache
  image: "$RUNNER_DOCKER_CLI_IMAGE"
  services:
    - name: "$RUNNER_DOCKER_DIND_IMAGE"
      alias: docker
      command: ["--tls=false"]
  needs:
    - job: publish-client-wheel
      artifacts: true
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
  before_script:
    - sed -i -e "s|http://dl-cdn.alpinelinux.org/alpine|${ALPINE_MIRROR}|g" -e "s|https://dl-cdn.alpinelinux.org/alpine|${ALPINE_MIRROR}|g" /etc/apk/repositories
    - apk add --no-cache curl
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - |
      if [ -n "${NGC_API_KEY:-}" ]; then
        echo "$NGC_API_KEY" | docker login nvcr.io --username '$oauthtoken' --password-stdin
      fi
  script:
    - |
      rm -f client/dist/*.whl
      curl --fail --silent --show-error --location \
        --retry 5 --retry-all-errors \
        --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
        --output "client/dist/$WHEEL_FILENAME" \
        "$WHEEL_REGISTRY_URL"
      downloaded_sha256="$(sha256sum "client/dist/$WHEEL_FILENAME" | cut -d' ' -f1)"
      if [ "$downloaded_sha256" != "$WHEEL_SHA256" ]; then
        echo "Registry wheel checksum does not match the build artifact" >&2
        exit 1
      fi
      wheel_count="$(find client/dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' | wc -l)"
      if [ "$wheel_count" -ne 1 ]; then
        echo "Expected exactly one staged client wheel, found $wheel_count" >&2
        exit 1
      fi
    - |
      # DinD starts with an empty daemon on every job. Pull the last verified
      # image so BuildKit can reuse its exported dependency layers.
      docker pull "$ENGINE_BUILD_CACHE_IMAGE" || true
      docker build --pull \
        --file infra/docker/Dockerfile.engine \
        --cache-from "$ENGINE_BUILD_CACHE_IMAGE" \
        --build-arg "BUILDKIT_INLINE_CACHE=1" \
        --build-arg "BASE_IMAGE=$ENGINE_BASE_IMAGE" \
        --build-arg "PIP_INDEX_URL=$PIP_INDEX_URL" \
        --build-arg "ENGINE_VERSION=$CI_COMMIT_TAG" \
        --build-arg "CLIENT_WHEEL_FILENAME=$WHEEL_FILENAME" \
        --build-arg "CLIENT_WHEEL_SHA256=$WHEEL_SHA256" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --tag "$ENGINE_RELEASE_IMAGE" \
        --tag "$ENGINE_BUILD_CACHE_IMAGE" \
        .
    - |
      container_id="$(docker create "$ENGINE_RELEASE_IMAGE")"
      trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
      docker cp "$container_id:/app/sdk/$WHEEL_FILENAME" /tmp/image-client.whl
      image_wheel_sha256="$(sha256sum /tmp/image-client.whl | cut -d' ' -f1)"
      if [ "$image_wheel_sha256" != "$WHEEL_SHA256" ]; then
        echo "Wheel embedded in engine image differs from the published wheel" >&2
        exit 1
      fi
      image_version="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$ENGINE_RELEASE_IMAGE")"
      if [ "$image_version" != "$CI_COMMIT_TAG" ]; then
        echo "Engine image version $image_version does not match tag $CI_COMMIT_TAG" >&2
        exit 1
      fi
      image_wheel_filename="$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.client-wheel.filename" }}' "$ENGINE_RELEASE_IMAGE")"
      image_wheel_label_sha256="$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.client-wheel.sha256" }}' "$ENGINE_RELEASE_IMAGE")"
      if [ "$image_wheel_filename" != "$WHEEL_FILENAME" ] || [ "$image_wheel_label_sha256" != "$WHEEL_SHA256" ]; then
        echo "Engine image wheel labels do not match the verified Registry artifact" >&2
        exit 1
      fi
      docker rm "$container_id" >/dev/null
      trap - EXIT
    - docker push "$ENGINE_RELEASE_IMAGE"
    - docker push "$ENGINE_BUILD_CACHE_IMAGE" || echo "Warning: could not update optional engine build cache" >&2

create-release:
  extends: .tag-release-job
  stage: release
  image: "$RUNNER_GLAB_IMAGE"
  needs:
    - job: publish-client-wheel
      artifacts: true
    - job: build-engine-image
      artifacts: false
  variables:
    GIT_STRATEGY: none
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - |
      notes="$(printf 'SDK wheel: `%s`\n\nSDK SHA256: `%s`\n\nEngine image: `%s`\n' \
        "$WHEEL_FILENAME" "$WHEEL_SHA256" "$ENGINE_RELEASE_IMAGE")"
      glab release create "$CI_COMMIT_TAG" \
        --repo "$CI_PROJECT_URL" \
        --ref "$CI_COMMIT_SHA" \
        --name "Qwen3TTS-Streaming $CI_COMMIT_TAG" \
        --notes "$notes"

      links_endpoint="projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
      links_json="$(glab api --hostname "$CI_SERVER_HOST" "$links_endpoint")"
      matching_links="$(printf '%s' "$links_json" | jq \
        --arg name "$WHEEL_FILENAME" \
        --arg url "$WHEEL_REGISTRY_URL" \
        '[.[] | select(.name == $name or .url == $url)]')"
      matching_count="$(printf '%s' "$matching_links" | jq 'length')"

      case "$matching_count" in
        0)
          matching_link="$(glab api --hostname "$CI_SERVER_HOST" \
            --method POST "$links_endpoint" \
            --raw-field "name=$WHEEL_FILENAME" \
            --raw-field "url=$WHEEL_REGISTRY_URL" \
            --raw-field "direct_asset_path=/client-sdk/$WHEEL_FILENAME" \
            --raw-field "link_type=package")"
          ;;
        1)
          matching_link="$(printf '%s' "$matching_links" | jq '.[0]')"
          ;;
        *)
          echo "Release has conflicting wheel asset links for $WHEEL_FILENAME" >&2
          exit 1
          ;;
      esac

      actual_name="$(printf '%s' "$matching_link" | jq -r '.name')"
      actual_url="$(printf '%s' "$matching_link" | jq -r '.url')"
      actual_direct_url="$(printf '%s' "$matching_link" | jq -r '.direct_asset_url')"
      actual_link_type="$(printf '%s' "$matching_link" | jq -r '.link_type')"
      if [ "$actual_name" != "$WHEEL_FILENAME" ] || \
         [ "$actual_url" != "$WHEEL_REGISTRY_URL" ] || \
         [ "$actual_direct_url" != "$WHEEL_RELEASE_URL" ] || \
         [ "$actual_link_type" != "package" ]; then
        echo "Existing GitLab Release asset does not match the published wheel" >&2
        exit 1
      fi
