name: Build Triton Runtime Base

on:
  workflow_dispatch:

concurrency:
  group: triton-runtime-base
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.RELEASE_IMAGE_RUNNER || 'self-hosted' }}
    permissions:
      contents: read
      packages: write
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
      TRITON_BASE_IMAGE: ${{ vars.TRITON_BASE_IMAGE || 'nvcr.io/nvidia/tritonserver:26.02-py3' }}
      TRITON_TENSORRT_PYTHON_VERSION: ${{ vars.TRITON_TENSORRT_PYTHON_VERSION || '10.15.1.29' }}
      TRITON_PYTORCH_CUDA_TAG: ${{ vars.TRITON_PYTORCH_CUDA_TAG || 'cu130' }}
      TRITON_RUNTIME_PARENT_TAG: ${{ vars.TRITON_RUNTIME_PARENT_TAG || 'runtime-base_26.02_trt10.15.1.29_cu130_r2' }}
      TRITON_RUNTIME_BASE_TAG: ${{ vars.TRITON_RUNTIME_BASE_TAG || 'runtime-base_26.02_trt10.15.1.29_cu130_r3' }}
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Log in to container registries
        shell: bash
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [[ -n "$NGC_API_KEY" ]]; then
            echo "$NGC_API_KEY" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish immutable Triton dependency base
        shell: bash
        run: |
          image_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-triton"
          runtime_base_image="ghcr.io/${image_repository}:${TRITON_RUNTIME_BASE_TAG}"
          runtime_parent_image="ghcr.io/${image_repository}:${TRITON_RUNTIME_PARENT_TAG}"
          previous_cache_image="ghcr.io/${image_repository}:buildcache"
          TRITON_RUNTIME_PARENT_IMAGE="$runtime_parent_image" \
            bash scripts/bash/publish_triton_runtime_base.sh \
            "$runtime_base_image" \
            "$previous_cache_image"
