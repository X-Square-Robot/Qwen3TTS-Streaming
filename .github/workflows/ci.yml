name: CI

env:
  # Repository variables with the same names can point at an internal mirror.
  PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL || 'https://mirrors.bfsu.edu.cn/pypi/web/simple' }}
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  PYTORCH_CPU_INDEX: ${{ vars.PYTORCH_CPU_INDEX || 'https://mirrors.nju.edu.cn/pytorch/whl/cpu' }}

# CPU CI covers Python, Browser SDK, the built Demo, and mock Realtime E2E.
# GPU/model-dependent live synthesis remains a release-environment smoke test.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: npm run pack:browser
        working-directory: web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify generated proto copies are in sync
        run: make proto-check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps (local client + test/engine extras, CPU torch)
        run: |
          pip install --upgrade pip
          pip install --index-url "$PYTORCH_CPU_INDEX" torch
          pip install -e "./client[all]"
          pip install -e ".[test,engine]"
      - name: unit tests (no GPU, no Docker)
        env:
          PYTHONPATH: client/src
        run: pytest tests/unit -m "not gpu and not docker" -q
