name: Release

env:
  # Defaults are optimized for runners in mainland China. Repository variables
  # with the same names can point at an internal proxy or restore an origin URL.
  PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL || 'https://mirrors.bfsu.edu.cn/pypi/web/simple' }}
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  ENGINE_BASE_IMAGE: ${{ vars.ENGINE_BASE_IMAGE || 'm.daocloud.io/nvcr.io/nvidia/pytorch:26.02-py3' }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to promote, for example v0.2.0 or v0.2.0rc1"
        required: true
        type: string
      source_ref:
        description: "Branch or commit SHA to release"
        required: true
        default: main
        type: string

concurrency:
  group: release-candidate-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  preflight-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.identity.outputs.release_version }}
      release_commit: ${{ steps.identity.outputs.release_commit }}
      candidate_id: ${{ steps.identity.outputs.candidate_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: false
      - name: Resolve exact candidate checkout
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_REF: ${{ inputs.source_ref }}
        run: bash scripts/bash/prepare_release_checkout.sh "$RELEASE_VERSION" "$RELEASE_REF"
      - name: Record candidate identity
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          release_commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short=12 HEAD)"
          {
            echo "release_version=$RELEASE_VERSION"
            echo "release_commit=$release_commit"
            echo "candidate_id=${RELEASE_VERSION#v}-${short_commit}-${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

  build-web-release:
    needs: preflight-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      browser_sdk_version: ${{ steps.web.outputs.browser_sdk_version }}
      browser_tarball: ${{ steps.web.outputs.browser_tarball }}
      demo_archive: ${{ steps.web.outputs.demo_archive }}
      browser_sha256: ${{ steps.web.outputs.browser_sha256 }}
      demo_sha256: ${{ steps.web.outputs.demo_sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.preflight-release.outputs.release_version }}
      RELEASE_COMMIT_SHA: ${{ needs.preflight-release.outputs.release_commit }}
      CANDIDATE_ID: ${{ needs.preflight-release.outputs.candidate_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight-release.outputs.release_commit }}
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@1e60f620b9541d8bd359a7c72e207f614cf4c05f # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare local version tag
        run: bash scripts/bash/prepare_release_checkout.sh "$RELEASE_VERSION" "$RELEASE_COMMIT_SHA"
      - name: Build and test web release once
        run: bash scripts/bash/release_web.sh "$RELEASE_VERSION"
      - name: Run cross-browser Demo E2E
        working-directory: web
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
      - name: Record web artifact metadata
        id: web
        shell: bash
        run: |
          source web/dist/web-release.env
          browser_tarball="$(find web/dist -maxdepth 1 -type f -name 'xmultimodalinteraction-qwen3tts-browser-*.tgz' -print)"
          demo_archive="$(find web/dist -maxdepth 1 -type f -name 'qwen3tts-demo-*.tar.gz' -print)"
          test -n "$browser_tarball" && test -n "$demo_archive"
          {
            echo "browser_sdk_version=$BROWSER_SDK_SEMVER"
            echo "browser_tarball=$(basename "$browser_tarball")"
            echo "demo_archive=$(basename "$demo_archive")"
            echo "browser_sha256=$(sha256sum "$browser_tarball" | cut -d' ' -f1)"
            echo "demo_sha256=$(sha256sum "$demo_archive" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ env.CANDIDATE_ID }}-web
          path: |
            web/packages/demo/dist/
            web/dist/
          if-no-files-found: error
          retention-days: 14

  build-client-wheel:
    needs: preflight-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sdk_version: ${{ steps.wheel.outputs.sdk_version }}
      wheel_filename: ${{ steps.wheel.outputs.wheel_filename }}
      wheel_sha256: ${{ steps.wheel.outputs.wheel_sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.preflight-release.outputs.release_version }}
      RELEASE_COMMIT_SHA: ${{ needs.preflight-release.outputs.release_commit }}
      CANDIDATE_ID: ${{ needs.preflight-release.outputs.candidate_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight-release.outputs.release_commit }}
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: client/pyproject.toml
      - name: Prepare local version tag
        run: bash scripts/bash/prepare_release_checkout.sh "$RELEASE_VERSION" "$RELEASE_COMMIT_SHA"
      - name: Validate release checkout
        shell: bash
        run: |
          initialized_submodules="$(git submodule status | sed -n '/^[^-]/p')"
          if [[ -n "$initialized_submodules" ]]; then
            echo "Release checkout unexpectedly contains initialized submodules:" >&2
            echo "$initialized_submodules" >&2
            exit 1
          fi
      - name: Build the client wheel once
        run: bash scripts/bash/release_client_wheel.sh --out build/github-client-dist
      - name: Record and verify wheel metadata
        id: wheel
        shell: bash
        run: |
          wheel_count="$(find build/github-client-dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' | wc -l)"
          if [[ "$wheel_count" -ne 1 ]]; then
            echo "Expected exactly one client wheel, found $wheel_count" >&2
            exit 1
          fi
          wheel="$(find build/github-client-dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' -print)"
          wheel_filename="$(basename "$wheel")"
          sdk_version="${RELEASE_VERSION#v}"
          wheel_sha256="$(sha256sum "$wheel" | cut -d' ' -f1)"
          {
            echo "sdk_version=$sdk_version"
            echo "wheel_filename=$wheel_filename"
            echo "wheel_sha256=$wheel_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Validate the installed wheel
        shell: bash
        run: |
          wheel="$(realpath "$(find build/github-client-dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' -print)")"
          python -m venv /tmp/qwen3tts-wheel-smoke
          /tmp/qwen3tts-wheel-smoke/bin/pip install \
            "qwen3-tts-client[all] @ file://$wheel" pytest pytest-asyncio twine==6.2.0
          /tmp/qwen3tts-wheel-smoke/bin/python -m twine check "$wheel"
          EXPECTED_VERSION="${RELEASE_VERSION#v}" \
            env -u PYTHONPATH /tmp/qwen3tts-wheel-smoke/bin/python -c \
            'import os, qwen3tts, qwen3tts_protocol; assert qwen3tts.__version__ == os.environ["EXPECTED_VERSION"]'
          env -u PYTHONPATH /tmp/qwen3tts-wheel-smoke/bin/python \
            -m pytest client/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ env.CANDIDATE_ID }}-client-wheel
          path: build/github-client-dist/*.whl
          if-no-files-found: error
          retention-days: 14

  build-engine-image:
    needs:
      - preflight-release
      - build-client-wheel
      - build-web-release
    runs-on: ${{ vars.RELEASE_IMAGE_RUNNER || 'self-hosted' }}
    permissions:
      contents: read
      packages: write
    outputs:
      engine_candidate_image: ${{ steps.image.outputs.engine_candidate_image }}
      triton_candidate_image: ${{ steps.image.outputs.triton_candidate_image }}
      engine_candidate_digest: ${{ steps.image.outputs.engine_candidate_digest }}
      triton_candidate_digest: ${{ steps.image.outputs.triton_candidate_digest }}
    env:
      DOCKER_BUILDKIT: "1"
      RELEASE_VERSION: ${{ needs.preflight-release.outputs.release_version }}
      RELEASE_COMMIT_SHA: ${{ needs.preflight-release.outputs.release_commit }}
      CANDIDATE_ID: ${{ needs.preflight-release.outputs.candidate_id }}
      WHEEL_FILENAME: ${{ needs.build-client-wheel.outputs.wheel_filename }}
      WHEEL_SHA256: ${{ needs.build-client-wheel.outputs.wheel_sha256 }}
      BROWSER_SDK_VERSION: ${{ needs.build-web-release.outputs.browser_sdk_version }}
      BROWSER_TARBALL: ${{ needs.build-web-release.outputs.browser_tarball }}
      BROWSER_SHA256: ${{ needs.build-web-release.outputs.browser_sha256 }}
      TRITON_BASE_IMAGE: ${{ vars.TRITON_BASE_IMAGE || 'nvcr.io/nvidia/tritonserver:26.02-py3' }}
      TRITON_TENSORRT_PYTHON_VERSION: ${{ vars.TRITON_TENSORRT_PYTHON_VERSION || '10.15.1.29' }}
      TRITON_PYTORCH_CUDA_TAG: ${{ vars.TRITON_PYTORCH_CUDA_TAG || 'cu130' }}
      TRITON_RUNTIME_BASE_TAG: ${{ vars.TRITON_RUNTIME_BASE_TAG || 'runtime-base_26.02_trt10.15.1.29_cu130_r4' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight-release.outputs.release_commit }}
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ needs.preflight-release.outputs.candidate_id }}-client-wheel
          path: client/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ needs.preflight-release.outputs.candidate_id }}-web
          path: candidate-web
      - name: Validate the exact candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT_SHA"
      - name: Prepare candidate build context
        shell: bash
        run: |
          wheel_count="$(find client/dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' | wc -l)"
          if [[ "$wheel_count" -ne 1 ]]; then
            echo "Expected exactly one staged client wheel, found $wheel_count" >&2
            exit 1
          fi
          rm -rf web/packages/demo/dist
          mkdir -p web/packages/demo/dist
          cp -a candidate-web/web/packages/demo/dist/. web/packages/demo/dist/
      - name: Log in to container registries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          if ! command -v gh >/dev/null || ! command -v docker >/dev/null; then
            echo "The release image runner must provide both GitHub CLI (gh) and Docker." >&2
            exit 1
          fi
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [[ -n "$NGC_API_KEY" ]]; then
            echo "$NGC_API_KEY" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          fi
      - name: Build and verify candidate runtime images
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          image_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          engine_candidate_image="ghcr.io/${image_repository}:candidate-${CANDIDATE_ID}"
          engine_cache_image="ghcr.io/${image_repository}:buildcache"
          triton_candidate_image="ghcr.io/${image_repository}-triton:candidate-${CANDIDATE_ID}"
          triton_cache_image="ghcr.io/${image_repository}-triton:buildcache"
          triton_runtime_base_image="ghcr.io/${image_repository}-triton:${TRITON_RUNTIME_BASE_TAG}"
          {
            echo "engine_candidate_image=$engine_candidate_image"
            echo "triton_candidate_image=$triton_candidate_image"
          } >> "$GITHUB_OUTPUT"

          if ! docker pull "$triton_runtime_base_image"; then
            echo "Required Triton runtime base is missing: $triton_runtime_base_image" >&2
            echo "Run the Build Triton Runtime Base workflow before preparing a release candidate." >&2
            exit 1
          fi
          docker run --rm --entrypoint python3 "$triton_runtime_base_image" -c \
            "import aiohttp, attr, packaging; print(f'aiohttp={aiohttp.__version__} attrs={attr.__version__} packaging={packaging.__version__}')"
          triton_runtime_base_digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$triton_runtime_base_image")"
          if [[ "$triton_runtime_base_digest" != *@sha256:* ]]; then
            echo "Could not resolve Triton runtime base to an immutable digest" >&2
            exit 1
          fi

          docker pull "$engine_cache_image" || true
          docker build --pull \
            --file infra/docker/Dockerfile.engine \
            --cache-from "$engine_cache_image" \
            --build-arg "BUILDKIT_INLINE_CACHE=1" \
            --build-arg "BASE_IMAGE=$ENGINE_BASE_IMAGE" \
            --build-arg "PIP_INDEX_URL=$PIP_INDEX_URL" \
            --build-arg "ENGINE_VERSION=$RELEASE_VERSION" \
            --build-arg "CLIENT_WHEEL_FILENAME=$WHEEL_FILENAME" \
            --build-arg "CLIENT_WHEEL_SHA256=$WHEEL_SHA256" \
            --build-arg "BROWSER_SDK_VERSION=$BROWSER_SDK_VERSION" \
            --build-arg "BROWSER_SDK_TARBALL_URL=./downloads/$BROWSER_TARBALL" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT_SHA" \
            --tag "$engine_candidate_image" \
            --tag "$engine_cache_image" \
            .

          docker build --pull --no-cache \
            --file infra/docker/Dockerfile.triton \
            --build-arg "BUILDKIT_INLINE_CACHE=1" \
            --build-arg "BASE_IMAGE=$TRITON_BASE_IMAGE" \
            --build-arg "TENSORRT_PYTHON_VERSION=$TRITON_TENSORRT_PYTHON_VERSION" \
            --build-arg "PYTORCH_CUDA_TAG=$TRITON_PYTORCH_CUDA_TAG" \
            --build-arg "TRITON_RUNTIME_BASE_IMAGE=$triton_runtime_base_digest" \
            --build-arg "TRITON_RUNTIME_BASE_REFERENCE=$triton_runtime_base_digest" \
            --build-arg "ENGINE_VERSION=$RELEASE_VERSION" \
            --build-arg "CLIENT_WHEEL_FILENAME=$WHEEL_FILENAME" \
            --build-arg "CLIENT_WHEEL_SHA256=$WHEEL_SHA256" \
            --build-arg "BROWSER_SDK_VERSION=$BROWSER_SDK_VERSION" \
            --build-arg "BROWSER_SDK_TARBALL_URL=./downloads/$BROWSER_TARBALL" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT_SHA" \
            --tag "$triton_candidate_image" \
            --tag "$triton_cache_image" \
            .

          container_id="$(docker create "$engine_candidate_image")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/sdk/$WHEEL_FILENAME" /tmp/image-client.whl
          test "$(sha256sum /tmp/image-client.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$engine_candidate_image")" = "$RELEASE_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$engine_candidate_image")" = "$RELEASE_COMMIT_SHA"
          test "$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.client-wheel.filename" }}' "$engine_candidate_image")" = "$WHEEL_FILENAME"
          test "$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.client-wheel.sha256" }}' "$engine_candidate_image")" = "$WHEEL_SHA256"
          test "$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.browser-sdk.version" }}' "$engine_candidate_image")" = "$BROWSER_SDK_VERSION"
          docker cp "$container_id:/app/demo/downloads/$BROWSER_TARBALL" /tmp/image-browser-sdk.tgz
          test "$(sha256sum /tmp/image-browser-sdk.tgz | cut -d' ' -f1)" = "$BROWSER_SHA256"
          docker cp "$container_id:/app/demo/index.html" /tmp/image-demo-index.html
          test -s /tmp/image-demo-index.html
          docker rm "$container_id" >/dev/null
          trap - EXIT
          docker run --rm "$engine_candidate_image" \
            python3 -m engine.distribution.container_smoke --runtime standalone

          container_id="$(docker create "$triton_candidate_image")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/sdk/$WHEEL_FILENAME" /tmp/triton-image-client.whl
          test "$(sha256sum /tmp/triton-image-client.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$triton_candidate_image")" = "$RELEASE_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$triton_candidate_image")" = "$RELEASE_COMMIT_SHA"
          test "$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.client-wheel.filename" }}' "$triton_candidate_image")" = "$WHEEL_FILENAME"
          test "$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.client-wheel.sha256" }}' "$triton_candidate_image")" = "$WHEEL_SHA256"
          test "$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.browser-sdk.version" }}' "$triton_candidate_image")" = "$BROWSER_SDK_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.triton-runtime-base.reference" }}' "$triton_candidate_image")" = "$triton_runtime_base_digest"
          docker cp "$container_id:/app/demo/downloads/$BROWSER_TARBALL" /tmp/triton-image-browser-sdk.tgz
          test "$(sha256sum /tmp/triton-image-browser-sdk.tgz | cut -d' ' -f1)" = "$BROWSER_SHA256"
          docker cp "$container_id:/app/demo/index.html" /tmp/triton-image-demo-index.html
          test -s /tmp/triton-image-demo-index.html
          docker rm "$container_id" >/dev/null
          trap - EXIT
          docker run --rm --entrypoint python3 "$triton_candidate_image" -c \
            "import aiohttp, attr, packaging; print(f'aiohttp={aiohttp.__version__} attrs={attr.__version__} packaging={packaging.__version__}')"
          docker run --rm "$triton_candidate_image" \
            python3 -m engine.distribution.container_smoke --runtime triton

          docker push "$engine_candidate_image"
          docker push "$triton_candidate_image"
          docker pull "$engine_candidate_image" >/dev/null
          docker pull "$triton_candidate_image" >/dev/null
          engine_candidate_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$engine_candidate_image" | awk -F@ 'NF == 2 { print $2; exit }')"
          triton_candidate_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$triton_candidate_image" | awk -F@ 'NF == 2 { print $2; exit }')"
          test -n "$engine_candidate_digest" && test -n "$triton_candidate_digest"
          {
            echo "engine_candidate_digest=$engine_candidate_digest"
            echo "triton_candidate_digest=$triton_candidate_digest"
          } >> "$GITHUB_OUTPUT"
          docker push "$engine_cache_image" || echo "Warning: could not update optional engine build cache" >&2
          docker push "$triton_cache_image" || echo "Warning: could not update optional Triton build cache" >&2

  promote-release:
    needs:
      - preflight-release
      - build-client-wheel
      - build-web-release
      - build-engine-image
    runs-on: ${{ vars.RELEASE_IMAGE_RUNNER || 'self-hosted' }}
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.preflight-release.outputs.release_version }}
      RELEASE_COMMIT_SHA: ${{ needs.preflight-release.outputs.release_commit }}
      CANDIDATE_ID: ${{ needs.preflight-release.outputs.candidate_id }}
      WHEEL_FILENAME: ${{ needs.build-client-wheel.outputs.wheel_filename }}
      WHEEL_SHA256: ${{ needs.build-client-wheel.outputs.wheel_sha256 }}
      BROWSER_TARBALL: ${{ needs.build-web-release.outputs.browser_tarball }}
      DEMO_ARCHIVE: ${{ needs.build-web-release.outputs.demo_archive }}
      BROWSER_SHA256: ${{ needs.build-web-release.outputs.browser_sha256 }}
      DEMO_SHA256: ${{ needs.build-web-release.outputs.demo_sha256 }}
      CANDIDATE_ENGINE_IMAGE: ${{ needs.build-engine-image.outputs.engine_candidate_image }}
      CANDIDATE_TRITON_IMAGE: ${{ needs.build-engine-image.outputs.triton_candidate_image }}
      CANDIDATE_ENGINE_DIGEST: ${{ needs.build-engine-image.outputs.engine_candidate_digest }}
      CANDIDATE_TRITON_DIGEST: ${{ needs.build-engine-image.outputs.triton_candidate_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight-release.outputs.release_commit }}
          fetch-depth: 1
          submodules: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ needs.preflight-release.outputs.candidate_id }}-client-wheel
          path: candidate-wheel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ needs.preflight-release.outputs.candidate_id }}-web
          path: candidate-web
      - name: Validate candidate artifacts
        shell: bash
        run: |
          wheel="$(find candidate-wheel -type f -name "$WHEEL_FILENAME" -print)"
          browser_tarball="$(find candidate-web -type f -name "$BROWSER_TARBALL" -print)"
          demo_archive="$(find candidate-web -type f -name "$DEMO_ARCHIVE" -print)"
          test -f "$wheel" && test -f "$browser_tarball" && test -f "$demo_archive"
          test "$(sha256sum "$wheel" | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum "$browser_tarball" | cut -d' ' -f1)" = "$BROWSER_SHA256"
          test "$(sha256sum "$demo_archive" | cut -d' ' -f1)" = "$DEMO_SHA256"
      - name: Log in to GHCR
        shell: bash
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Promote candidate images
        shell: bash
        run: |
          image_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          engine_image="ghcr.io/${image_repository}:${RELEASE_VERSION}"
          triton_image="ghcr.io/${image_repository}-triton:${RELEASE_VERSION}"
          bash scripts/bash/promote_container_image.sh \
            "$CANDIDATE_ENGINE_IMAGE" "$engine_image" "$CANDIDATE_ENGINE_DIGEST"
          bash scripts/bash/promote_container_image.sh \
            "$CANDIDATE_TRITON_IMAGE" "$triton_image" "$CANDIDATE_TRITON_DIGEST"
          {
            echo "ENGINE_IMAGE=$engine_image"
            echo "TRITON_IMAGE=$triton_image"
          } >> "$GITHUB_ENV"
      - name: Create or verify the formal version tag
        shell: bash
        run: |
          tag_endpoint="repos/$GH_REPO/git/ref/tags/$RELEASE_VERSION"
          tag_error="$(mktemp)"
          if tag_type="$(gh api "$tag_endpoint" --jq '.object.type' 2>"$tag_error")"; then
            tag_object="$(gh api "$tag_endpoint" --jq '.object.sha')"
            if [[ "$tag_type" == tag ]]; then
              tag_object="$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq '.object.sha')"
            fi
            if [[ "$tag_object" != "$RELEASE_COMMIT_SHA" ]]; then
              echo "GitHub tag $RELEASE_VERSION already points to $tag_object, expected $RELEASE_COMMIT_SHA" >&2
              exit 1
            fi
          else
            if ! grep -Eiq '404|not found' "$tag_error"; then
              cat "$tag_error" >&2
              exit 1
            fi
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_VERSION" \
              -f "sha=$RELEASE_COMMIT_SHA" >/dev/null
          fi
          rm -f "$tag_error"
      - name: Create or verify the draft GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_VERSION"
          else
            prerelease_args=()
            if [[ "$RELEASE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$RELEASE_VERSION" \
              --verify-tag \
              --draft \
              --title "Qwen3TTS-Streaming $RELEASE_VERSION" \
              --notes "Release promotion in progress for candidate $CANDIDATE_ID." \
              "${prerelease_args[@]}"
          fi
      - name: Upload or verify release assets
        shell: bash
        run: |
          upload_or_verify_asset() {
            asset_path="$1"
            asset_name="$(basename "$asset_path")"
            asset_sha256="$(sha256sum "$asset_path" | cut -d' ' -f1)"
            asset_names="$(gh release view "$RELEASE_VERSION" --json assets --jq '.assets[].name')"
            verify_dir="$(mktemp -d)"
            if grep -Fqx "$asset_name" <<<"$asset_names"; then
              gh release download "$RELEASE_VERSION" --pattern "$asset_name" --dir "$verify_dir"
              if [[ "$(sha256sum "$verify_dir/$asset_name" | cut -d' ' -f1)" != "$asset_sha256" ]]; then
                echo "GitHub Release already contains different bytes for $asset_name" >&2
                rm -rf "$verify_dir"
                exit 1
              fi
              echo "Release asset already matches candidate: $asset_name"
            else
              gh release upload "$RELEASE_VERSION" "$asset_path"
              rm -rf "$verify_dir"
              verify_dir="$(mktemp -d)"
              gh release download "$RELEASE_VERSION" --pattern "$asset_name" --dir "$verify_dir"
              test "$(sha256sum "$verify_dir/$asset_name" | cut -d' ' -f1)" = "$asset_sha256"
            fi
            rm -rf "$verify_dir"
          }
          upload_or_verify_asset "$(find candidate-wheel -type f -name "$WHEEL_FILENAME" -print)"
          upload_or_verify_asset "$(find candidate-web -type f -name "$BROWSER_TARBALL" -print)"
          upload_or_verify_asset "$(find candidate-web -type f -name "$DEMO_ARCHIVE" -print)"
      - name: Publish the verified GitHub Release
        shell: bash
        run: |
          release_draft="$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)"
          if [[ "$release_draft" == true ]]; then
            notes="$(printf 'Source commit: `%s`\n\nCandidate: `%s`\n\nSDK wheel: `%s`\n\nSDK SHA256: `%s`\n\nStandalone image: `%s`\n\nTriton image: `%s`\n' \
              "$RELEASE_COMMIT_SHA" "$CANDIDATE_ID" "$WHEEL_FILENAME" "$WHEEL_SHA256" "$ENGINE_IMAGE" "$TRITON_IMAGE")"
            gh release edit "$RELEASE_VERSION" \
              --title "Qwen3TTS-Streaming $RELEASE_VERSION" \
              --notes "$notes" \
              --draft=false
          else
            echo "GitHub Release is already published; all candidate assets were verified."
          fi
