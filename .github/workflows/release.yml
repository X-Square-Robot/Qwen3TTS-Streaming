name: Release

env:
  # Defaults are optimized for runners in mainland China. Repository variables
  # with the same names can point at an internal proxy or restore an origin URL.
  PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL || 'https://mirrors.bfsu.edu.cn/pypi/web/simple' }}
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  ENGINE_BASE_IMAGE: ${{ vars.ENGINE_BASE_IMAGE || 'm.daocloud.io/nvcr.io/nvidia/pytorch:26.02-py3' }}

on:
  push:
    tags:
      - "v[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-web-release:
    runs-on: ubuntu-latest
    outputs:
      browser_sdk_version: ${{ steps.web.outputs.browser_sdk_version }}
      browser_tarball: ${{ steps.web.outputs.browser_tarball }}
      demo_archive: ${{ steps.web.outputs.demo_archive }}
      browser_sha256: ${{ steps.web.outputs.browser_sha256 }}
      demo_sha256: ${{ steps.web.outputs.demo_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - uses: actions/setup-node@1e60f620b9541d8bd359a7c72e207f614cf4c05f # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test web release once
        run: bash scripts/bash/release_web.sh "$GITHUB_REF_NAME"
      - name: Run cross-browser Demo E2E
        working-directory: web
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
      - name: Record web artifact metadata
        id: web
        shell: bash
        run: |
          source web/dist/web-release.env
          echo "browser_sdk_version=$BROWSER_SDK_SEMVER" >> "$GITHUB_OUTPUT"
          echo "browser_tarball=$(basename "$(find web/dist -name 'xmultimodalinteraction-qwen3tts-browser-*.tgz' -print)")" >> "$GITHUB_OUTPUT"
          echo "demo_archive=$(basename "$(find web/dist -name 'qwen3tts-demo-*.tar.gz' -print)")" >> "$GITHUB_OUTPUT"
          echo "browser_sha256=$(sha256sum "$(find web/dist -name 'xmultimodalinteraction-qwen3tts-browser-*.tgz' -print)" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "demo_sha256=$(sha256sum "$(find web/dist -name 'qwen3tts-demo-*.tar.gz' -print)" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-release-${{ github.ref_name }}
          path: |
            web/packages/demo/dist/
            web/dist/
          if-no-files-found: error
          retention-days: 7

  build-client-wheel:
    runs-on: ubuntu-latest
    outputs:
      sdk_version: ${{ steps.wheel.outputs.sdk_version }}
      wheel_filename: ${{ steps.wheel.outputs.wheel_filename }}
      wheel_sha256: ${{ steps.wheel.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: client/pyproject.toml

      - name: Validate release checkout
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          initialized_submodules="$(git submodule status | sed -n '/^[^-]/p')"
          if [[ -n "$initialized_submodules" ]]; then
            echo "Release checkout unexpectedly contains initialized submodules:" >&2
            echo "$initialized_submodules" >&2
            exit 1
          fi

      - name: Build the client wheel once
        run: bash scripts/bash/release_client_wheel.sh --out build/github-client-dist

      - name: Record and verify wheel metadata
        id: wheel
        shell: bash
        run: |
          wheel_count="$(find build/github-client-dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' | wc -l)"
          if [[ "$wheel_count" -ne 1 ]]; then
            echo "Expected exactly one client wheel, found $wheel_count" >&2
            exit 1
          fi
          wheel="$(find build/github-client-dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' -print)"
          wheel_filename="$(basename "$wheel")"
          sdk_version="${GITHUB_REF_NAME#v}"
          wheel_sha256="$(sha256sum "$wheel" | cut -d' ' -f1)"
          {
            echo "sdk_version=$sdk_version"
            echo "wheel_filename=$wheel_filename"
            echo "wheel_sha256=$wheel_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Validate the installed wheel
        shell: bash
        run: |
          wheel="$(realpath "$(find build/github-client-dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' -print)")"
          python -m venv /tmp/qwen3tts-wheel-smoke
          /tmp/qwen3tts-wheel-smoke/bin/pip install \
            "qwen3-tts-client[all] @ file://$wheel" pytest pytest-asyncio twine==6.2.0
          /tmp/qwen3tts-wheel-smoke/bin/python -m twine check "$wheel"
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" \
            env -u PYTHONPATH /tmp/qwen3tts-wheel-smoke/bin/python -c \
            'import os, qwen3tts, qwen3tts_protocol; assert qwen3tts.__version__ == os.environ["EXPECTED_VERSION"]'
          env -u PYTHONPATH /tmp/qwen3tts-wheel-smoke/bin/python \
            -m pytest client/tests -q

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-wheel-${{ github.ref_name }}
          path: build/github-client-dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish-client-wheel:
    needs: [build-client-wheel, build-web-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WHEEL_FILENAME: ${{ needs.build-client-wheel.outputs.wheel_filename }}
      WHEEL_SHA256: ${{ needs.build-client-wheel.outputs.wheel_sha256 }}
      BROWSER_TARBALL: ${{ needs.build-web-release.outputs.browser_tarball }}
      DEMO_ARCHIVE: ${{ needs.build-web-release.outputs.demo_archive }}
      BROWSER_SHA256: ${{ needs.build-web-release.outputs.browser_sha256 }}
      DEMO_SHA256: ${{ needs.build-web-release.outputs.demo_sha256 }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-wheel-${{ github.ref_name }}
          path: build/github-client-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-release-${{ github.ref_name }}
          path: web-release

      - name: Publish the wheel to a draft GitHub Release
        shell: bash
        run: |
          wheel="build/github-client-dist/$WHEEL_FILENAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to mutate an already-published GitHub Release: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            prerelease_args=()
            if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "Qwen3TTS-Streaming $GITHUB_REF_NAME" \
              --notes "Release pipeline in progress." \
              "${prerelease_args[@]}"
          fi

          mkdir -p /tmp/existing-release-wheel
          asset_names="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          if grep -Fqx "$WHEEL_FILENAME" <<<"$asset_names"; then
            gh release download "$GITHUB_REF_NAME" \
              --pattern "$WHEEL_FILENAME" \
              --dir /tmp/existing-release-wheel
            existing_sha256="$(sha256sum "/tmp/existing-release-wheel/$WHEEL_FILENAME" | cut -d' ' -f1)"
            if [[ "$existing_sha256" != "$WHEEL_SHA256" ]]; then
              echo "GitHub Release already contains different bytes for $WHEEL_FILENAME" >&2
              exit 1
            fi
          else
            gh release upload "$GITHUB_REF_NAME" "$wheel"
          fi

          rm -f "/tmp/existing-release-wheel/$WHEEL_FILENAME"
          gh release download "$GITHUB_REF_NAME" \
            --pattern "$WHEEL_FILENAME" \
            --dir /tmp/existing-release-wheel
          published_sha256="$(sha256sum "/tmp/existing-release-wheel/$WHEEL_FILENAME" | cut -d' ' -f1)"
          if [[ "$published_sha256" != "$WHEEL_SHA256" ]]; then
            echo "Published GitHub Release wheel checksum does not match the build artifact" >&2
            exit 1
          fi
          mkdir -p /tmp/verified-web-assets
          for spec in "$BROWSER_TARBALL|$BROWSER_SHA256" "$DEMO_ARCHIVE|$DEMO_SHA256"; do
            name="${spec%%|*}"
            expected="${spec#*|}"
            asset="web-release/dist/$name"
            test "$(sha256sum "$asset" | cut -d' ' -f1)" = "$expected"
            current_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            if grep -Fqx "$name" <<<"$current_assets"; then
              gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir /tmp/verified-web-assets
              if [[ "$(sha256sum "/tmp/verified-web-assets/$name" | cut -d' ' -f1)" != "$expected" ]]; then
                echo "GitHub Release already contains different bytes for $name" >&2
                exit 1
              fi
            else
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
            rm -f "/tmp/verified-web-assets/$name"
            gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir /tmp/verified-web-assets
            test "$(sha256sum "/tmp/verified-web-assets/$name" | cut -d' ' -f1)" = "$expected"
          done

  build-engine-image:
    needs:
      - build-client-wheel
      - publish-client-wheel
      - build-web-release
    # The NVIDIA PyTorch runtime image exceeds the practical disk budget of a
    # standard 14 GB hosted runner. Point RELEASE_IMAGE_RUNNER at a
    # larger runner label; otherwise use a repository self-hosted runner.
    runs-on: ${{ vars.RELEASE_IMAGE_RUNNER || 'self-hosted' }}
    permissions:
      contents: read
      packages: write
    outputs:
      engine_image: ${{ steps.image.outputs.engine_image }}
      triton_image: ${{ steps.image.outputs.triton_image }}
    env:
      DOCKER_BUILDKIT: "1"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
      WHEEL_FILENAME: ${{ needs.build-client-wheel.outputs.wheel_filename }}
      WHEEL_SHA256: ${{ needs.build-client-wheel.outputs.wheel_sha256 }}
      BROWSER_SDK_VERSION: ${{ needs.build-web-release.outputs.browser_sdk_version }}
      BROWSER_TARBALL: ${{ needs.build-web-release.outputs.browser_tarball }}
      TRITON_BASE_IMAGE: ${{ vars.TRITON_BASE_IMAGE || 'nvcr.io/nvidia/tritonserver:26.02-py3' }}
      TRITON_TENSORRT_PYTHON_VERSION: ${{ vars.TRITON_TENSORRT_PYTHON_VERSION || '10.15.1.29' }}
      TRITON_PYTORCH_CUDA_TAG: ${{ vars.TRITON_PYTORCH_CUDA_TAG || 'cu130' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Download the canonical wheel from the GitHub Release
        shell: bash
        run: |
          if ! command -v gh >/dev/null || ! command -v docker >/dev/null; then
            echo "The release image runner must provide both GitHub CLI (gh) and Docker." >&2
            exit 1
          fi
          rm -f client/dist/*.whl
          gh release download "$GITHUB_REF_NAME" \
            --pattern "$WHEEL_FILENAME" \
            --dir client/dist
          downloaded_sha256="$(sha256sum "client/dist/$WHEEL_FILENAME" | cut -d' ' -f1)"
          if [[ "$downloaded_sha256" != "$WHEEL_SHA256" ]]; then
            echo "GitHub Release wheel checksum does not match the build artifact" >&2
            exit 1
          fi
          wheel_count="$(find client/dist -maxdepth 1 -type f -name 'qwen3_tts_client-*.whl' | wc -l)"
          if [[ "$wheel_count" -ne 1 ]]; then
            echo "Expected exactly one staged client wheel, found $wheel_count" >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-release-${{ github.ref_name }}
          path: web-release

      - name: Stage the prebuilt Demo site
        shell: bash
        run: |
          rm -rf web/packages/demo/dist
          mkdir -p web/packages/demo/dist
          cp -a web-release/packages/demo/dist/. web/packages/demo/dist/

      - name: Log in to container registries
        shell: bash
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [[ -n "$NGC_API_KEY" ]]; then
            echo "$NGC_API_KEY" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          fi

      - name: Build and verify both runtime images
        id: image
        shell: bash
        run: |
          image_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          engine_image="ghcr.io/${image_repository}:${GITHUB_REF_NAME}"
          engine_cache_image="ghcr.io/${image_repository}:buildcache"
          triton_image="ghcr.io/${image_repository}-triton:${GITHUB_REF_NAME}"
          triton_cache_image="ghcr.io/${image_repository}-triton:buildcache"
          echo "engine_image=$engine_image" >> "$GITHUB_OUTPUT"
          echo "triton_image=$triton_image" >> "$GITHUB_OUTPUT"

          docker pull "$engine_cache_image" || true
          docker build --pull \
            --file infra/docker/Dockerfile.engine \
            --cache-from "$engine_cache_image" \
            --build-arg "BUILDKIT_INLINE_CACHE=1" \
            --build-arg "BASE_IMAGE=$ENGINE_BASE_IMAGE" \
            --build-arg "PIP_INDEX_URL=$PIP_INDEX_URL" \
            --build-arg "ENGINE_VERSION=$GITHUB_REF_NAME" \
            --build-arg "CLIENT_WHEEL_FILENAME=$WHEEL_FILENAME" \
            --build-arg "CLIENT_WHEEL_SHA256=$WHEEL_SHA256" \
            --build-arg "BROWSER_SDK_VERSION=$BROWSER_SDK_VERSION" \
            --build-arg "BROWSER_SDK_TARBALL_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$BROWSER_TARBALL" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$engine_image" \
            --tag "$engine_cache_image" \
            .

          docker pull "$triton_cache_image" || true
          docker build --pull \
            --file infra/docker/Dockerfile.triton \
            --cache-from "$triton_cache_image" \
            --build-arg "BUILDKIT_INLINE_CACHE=1" \
            --build-arg "BASE_IMAGE=$TRITON_BASE_IMAGE" \
            --build-arg "TENSORRT_PYTHON_VERSION=$TRITON_TENSORRT_PYTHON_VERSION" \
            --build-arg "PYTORCH_CUDA_TAG=$TRITON_PYTORCH_CUDA_TAG" \
            --build-arg "ENGINE_VERSION=$GITHUB_REF_NAME" \
            --build-arg "CLIENT_WHEEL_FILENAME=$WHEEL_FILENAME" \
            --build-arg "CLIENT_WHEEL_SHA256=$WHEEL_SHA256" \
            --build-arg "BROWSER_SDK_VERSION=$BROWSER_SDK_VERSION" \
            --build-arg "BROWSER_SDK_TARBALL_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$BROWSER_TARBALL" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$triton_image" \
            --tag "$triton_cache_image" \
            .

          container_id="$(docker create "$engine_image")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/sdk/$WHEEL_FILENAME" /tmp/image-client.whl
          image_wheel_sha256="$(sha256sum /tmp/image-client.whl | cut -d' ' -f1)"
          if [[ "$image_wheel_sha256" != "$WHEEL_SHA256" ]]; then
            echo "Wheel embedded in engine image differs from the GitHub Release wheel" >&2
            exit 1
          fi
          image_version="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$engine_image")"
          if [[ "$image_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Engine image version $image_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          image_wheel_filename="$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.client-wheel.filename" }}' "$engine_image")"
          image_wheel_label_sha256="$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.client-wheel.sha256" }}' "$engine_image")"
          if [[ "$image_wheel_filename" != "$WHEEL_FILENAME" || "$image_wheel_label_sha256" != "$WHEEL_SHA256" ]]; then
            echo "Engine image wheel labels do not match the verified Release asset" >&2
            exit 1
          fi
          image_browser_version="$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.browser-sdk.version" }}' "$engine_image")"
          if [[ "$image_browser_version" != "$BROWSER_SDK_VERSION" ]]; then
            echo "Engine image browser SDK version does not match the web artifact" >&2
            exit 1
          fi
          docker cp "$container_id:/app/demo/index.html" /tmp/image-demo-index.html
          test -s /tmp/image-demo-index.html
          docker rm "$container_id" >/dev/null
          trap - EXIT
          docker run --rm "$engine_image" \
            python3 -m engine.distribution.container_smoke --runtime standalone
          docker push "$engine_image"
          docker push "$engine_cache_image" || echo "Warning: could not update optional engine build cache" >&2

          container_id="$(docker create "$triton_image")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/sdk/$WHEEL_FILENAME" /tmp/triton-image-client.whl
          test "$(sha256sum /tmp/triton-image-client.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$triton_image")" = "$GITHUB_REF_NAME"
          test "$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.client-wheel.filename" }}' "$triton_image")" = "$WHEEL_FILENAME"
          test "$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.client-wheel.sha256" }}' "$triton_image")" = "$WHEEL_SHA256"
          test "$(docker inspect --format '{{ index .Config.Labels "io.qwen3tts.browser-sdk.version" }}' "$triton_image")" = "$BROWSER_SDK_VERSION"
          docker cp "$container_id:/app/demo/index.html" /tmp/triton-image-demo-index.html
          test -s /tmp/triton-image-demo-index.html
          docker rm "$container_id" >/dev/null
          trap - EXIT
          docker run --rm --env PYTHONPATH=/opt/qwen3-tts "$triton_image" \
            python3 -m engine.distribution.container_smoke --runtime triton
          docker push "$triton_image"
          docker push "$triton_cache_image" || echo "Warning: could not update optional Triton build cache" >&2

  finalize-release:
    needs:
      - build-client-wheel
      - build-engine-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WHEEL_FILENAME: ${{ needs.build-client-wheel.outputs.wheel_filename }}
      WHEEL_SHA256: ${{ needs.build-client-wheel.outputs.wheel_sha256 }}
      ENGINE_IMAGE: ${{ needs.build-engine-image.outputs.engine_image }}
      TRITON_IMAGE: ${{ needs.build-engine-image.outputs.triton_image }}
    steps:
      - name: Publish the verified GitHub Release
        shell: bash
        run: |
          is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "Expected a draft GitHub Release before finalization: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          notes="$(printf 'SDK wheel: `%s`\n\nSDK SHA256: `%s`\n\nStandalone image: `%s`\n\nTriton image: `%s`\n' \
            "$WHEEL_FILENAME" "$WHEEL_SHA256" "$ENGINE_IMAGE" "$TRITON_IMAGE")"
          gh release edit "$GITHUB_REF_NAME" \
            --title "Qwen3TTS-Streaming $GITHUB_REF_NAME" \
            --notes "$notes" \
            --draft=false
